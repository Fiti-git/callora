# Callora microservices stack.
#
# NOTE: There is no standalone `shared-build` service. Each service that depends
# on @callora/shared builds it inside its own Dockerfile (multi-stage:
# `shared-builder` stage compiles shared/, then copies dist into the service's
# node_modules). Services that don't depend on shared (api-gateway,
# notification-service) use a simpler single-context Dockerfile.
#
# Production hardening:
# - Default logging is rotated json-file (10MB x 3 files) so a noisy container
#   can't fill the host disk.
# - Postgres and Redis ports are bound to 127.0.0.1 only — reachable from the
#   host (psql, backup script) but not from the public internet.
# - The db container has explicit memory limits so a runaway query can't
#   OOM-kill other services.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:15
    container_name: callora-db
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    deploy:
      resources:
        limits:
          memory: 2g
        reservations:
          memory: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: callora-redis
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:6379:6379"
    deploy:
      resources:
        limits:
          memory: 512m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Anchor for service-level healthchecks. Each Node service exposes
  # /health on its assigned port; we hit it with `node` (no curl/wget
  # needed — the image is node:20-bookworm-slim which already has node).
  # interval/timeout/retries/start_period are tuned for cold-start:
  # services need ~30s before first check, then we give them 75s of
  # retry budget before they're declared unhealthy.
  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: callora-api-gateway
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "4000:4000"
    environment:
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      AUTH_SERVICE_URL: http://auth-service:4001
      CAMPAIGN_SERVICE_URL: http://campaign-service:4002
      LEAD_SERVICE_URL: http://lead-service:4003
      CALLING_SERVICE_URL: http://calling-service:4004
      CRM_SERVICE_URL: http://crm-service:4005
      BILLING_SERVICE_URL: http://billing-service:4006
      PLATFORM_SERVICE_URL: http://platform-service:4007
      NOTIFICATION_SERVICE_URL: http://notification-service:4008
      ANALYTICS_SERVICE_URL: http://analytics-service:4009
      TENANT_APP_ORIGIN: ${TENANT_APP_ORIGIN}
      ADMIN_APP_ORIGIN: ${ADMIN_APP_ORIGIN}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>r.json().then(b=>process.exit(b.status==='ok'?0:1))).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      auth-service:
        condition: service_started
      campaign-service:
        condition: service_started
      lead-service:
        condition: service_started
      calling-service:
        condition: service_started
      crm-service:
        condition: service_started
      billing-service:
        condition: service_started
      platform-service:
        condition: service_started
      notification-service:
        condition: service_started
      analytics-service:
        condition: service_started

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: callora-auth-service
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "4001:4001"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NOTIFICATION_SERVICE_URL: http://notification-service:4008
      TENANT_APP_ORIGIN: ${TENANT_APP_ORIGIN}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4001/health').then(r=>r.json().then(b=>process.exit(b.status==='ok'?0:1))).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy

  campaign-service:
    build:
      context: .
      dockerfile: services/campaign-service/Dockerfile
    container_name: callora-campaign-service
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "4002:4002"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      REDIS_URL: redis://redis:6379
      LEAD_SERVICE_URL: http://lead-service:4003
      CALLING_SERVICE_URL: http://calling-service:4004
      NOTIFICATION_SERVICE_URL: http://notification-service:4008
      TENANT_APP_ORIGIN: ${TENANT_APP_ORIGIN}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4002/health').then(r=>r.json().then(b=>process.exit(b.status==='ok'?0:1))).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  lead-service:
    build:
      context: .
      dockerfile: services/lead-service/Dockerfile
    container_name: callora-lead-service
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "4003:4003"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      TENANT_APP_ORIGIN: ${TENANT_APP_ORIGIN}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4003/health').then(r=>r.json().then(b=>process.exit(b.status==='ok'?0:1))).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy

  calling-service:
    build:
      context: .
      dockerfile: services/calling-service/Dockerfile
    container_name: callora-calling-service
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "4004:4004"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      VAPI_PRIVATE_KEY: ${VAPI_PRIVATE_KEY}
      VAPI_PHONE_NUMBER_ID: ${VAPI_PHONE_NUMBER_ID}
      VAPI_WEBHOOK_SECRET: ${VAPI_WEBHOOK_SECRET}
      TENANT_APP_ORIGIN: ${TENANT_APP_ORIGIN}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4004/health').then(r=>r.json().then(b=>process.exit(b.status==='ok'?0:1))).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy

  crm-service:
    build:
      context: .
      dockerfile: services/crm-service/Dockerfile
    container_name: callora-crm-service
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "4005:4005"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      TENANT_APP_ORIGIN: ${TENANT_APP_ORIGIN}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4005/health').then(r=>r.json().then(b=>process.exit(b.status==='ok'?0:1))).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy

  billing-service:
    build:
      context: .
      dockerfile: services/billing-service/Dockerfile
    container_name: callora-billing-service
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "4006:4006"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_PRICE_FREE: ${STRIPE_PRICE_FREE}
      STRIPE_PRICE_STARTER: ${STRIPE_PRICE_STARTER}
      STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO}
      STRIPE_PRICE_ENTERPRISE: ${STRIPE_PRICE_ENTERPRISE}
      NOTIFICATION_SERVICE_URL: http://notification-service:4008
      CALLING_SERVICE_URL: http://calling-service:4004
      TENANT_APP_ORIGIN: ${TENANT_APP_ORIGIN}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4006/health').then(r=>r.json().then(b=>process.exit(b.status==='ok'?0:1))).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      calling-service:
        condition: service_started

  platform-service:
    build:
      context: .
      dockerfile: services/platform-service/Dockerfile
    container_name: callora-platform-service
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "4007:4007"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PLATFORM_JWT_SECRET: ${PLATFORM_JWT_SECRET}
      ADMIN_APP_ORIGIN: ${ADMIN_APP_ORIGIN}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4007/health').then(r=>r.json().then(b=>process.exit(b.status==='ok'?0:1))).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy

  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    container_name: callora-notification-service
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "4008:4008"
    environment:
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      EMAIL_FROM: ${EMAIL_FROM}
      APP_URL: ${TENANT_APP_ORIGIN}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4008/health').then(r=>r.json().then(b=>process.exit(b.status==='ok'?0:1))).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  analytics-service:
    build:
      context: .
      dockerfile: services/analytics-service/Dockerfile
    container_name: callora-analytics-service
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "4009:4009"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      TENANT_APP_ORIGIN: ${TENANT_APP_ORIGIN}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4009/health').then(r=>r.json().then(b=>process.exit(b.status==='ok'?0:1))).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: callora-frontend
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "3000:3000"
    environment:
      NEXTAUTH_URL: ${TENANT_APP_ORIGIN}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      API_URL: http://api-gateway:4000
      NEXT_PUBLIC_API_URL: http://localhost:4000
    healthcheck:
      # Next.js doesn't expose /api/health here. Use a TCP probe via node.net
      # to confirm port 3000 is accepting connections.
      test: ["CMD", "node", "-e", "require('net').createConnection(3000,'localhost').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      api-gateway:
        condition: service_started

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: callora-admin
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "3001:3001"
    environment:
      NEXTAUTH_URL: ${ADMIN_APP_ORIGIN}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXT_PUBLIC_PLATFORM_API_URL: http://localhost:4000
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').createConnection(3001,'localhost').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      platform-service:
        condition: service_started

volumes:
  pgdata:
