services:
  db:
    image: postgres:15
    container_name: callora-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 3
    networks:
      - callora-network

  redis:
    image: redis:7-alpine
    container_name: callora-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 3
    networks:
      - callora-network

  migrate:
    image: callora-backend:latest
    container_name: callora-migrate
    command: npx prisma migrate deploy
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks:
      - callora-network

  backend:
    image: callora-backend:latest
    container_name: callora-backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "4000:4000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - callora-network

  frontend:
    image: callora-frontend:latest
    container_name: callora-frontend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_started
    networks:
      - callora-network

  admin:
    image: callora-admin:latest
    container_name: callora-admin
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3001:3001"
    depends_on:
      backend:
        condition: service_started
    networks:
      - callora-network

networks:
  callora-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
