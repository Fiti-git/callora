# Callora TINY deploy — 1 GB VPS profile.
#
# Differences from docker-compose.compact.yml:
#   - NO local Postgres (use Supabase free tier; set DATABASE_URL)
#   - NO local Redis    (use Upstash free tier; set REDIS_URL)
#   - 3 bundles capped at 256 MiB RAM / 0.5 vCPU each (~768 MiB total)
#   - Node heap pinned to 200 MB per bundle
#   - Worker concurrency = 1
#   - Caddy reverse proxy in front for HTTPS
#
# Usage on the VPS:
#   1. Create 2 GiB swap (see docs/ops/TINY_DEPLOY.md)
#   2. cp .env.tiny.example .env && fill in
#   3. docker compose -f docker-compose.tiny.yml up -d
#
# Frontend + admin Next.js apps are NOT in this file. Host them on
# Vercel / Cloudflare Pages free tier and point them at https://api.<domain>.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "2"

x-bundle-defaults: &bundle-defaults
  restart: unless-stopped
  logging: *default-logging
  mem_limit: 256m
  memswap_limit: 512m
  cpus: 0.5

services:
  caddy:
    image: caddy:2-alpine
    container_name: callora-caddy
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - edge
    mem_limit: 96m
    cpus: 0.25

  edge:
    <<: *bundle-defaults
    build:
      context: .
      dockerfile: bundles/edge/Dockerfile
    image: callora/edge:latest
    container_name: callora-edge
    expose:
      - "4000"
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=200
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      PLATFORM_JWT_SECRET: ${PLATFORM_JWT_SECRET}
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY}
      SECRETS_BACKEND: ${SECRETS_BACKEND:-db}
      TENANT_APP_ORIGIN: ${TENANT_APP_ORIGIN}
      ADMIN_APP_ORIGIN: ${ADMIN_APP_ORIGIN}
      CORE_BUNDLE_URL: http://core:4002
      IO_BUNDLE_URL: http://io:4004
    depends_on:
      core: { condition: service_started }
      io: { condition: service_started }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s

  core:
    <<: *bundle-defaults
    build:
      context: .
      dockerfile: bundles/core/Dockerfile
    image: callora/core:latest
    container_name: callora-core
    expose:
      - "4002"
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=200
      PORT: 4002
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY}
      SECRETS_BACKEND: ${SECRETS_BACKEND:-db}
      TENANT_APP_ORIGIN: ${TENANT_APP_ORIGIN}
      NOTIFICATION_SERVICE_URL: http://io:4004
      CALLING_SERVICE_URL: http://io:4004
      BILLING_SERVICE_URL: http://io:4004
      WORKER_CONCURRENCY: "1"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  io:
    <<: *bundle-defaults
    build:
      context: .
      dockerfile: bundles/io/Dockerfile
    image: callora/io:latest
    container_name: callora-io
    expose:
      - "4004"
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=200
      PORT: 4004
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY}
      SECRETS_BACKEND: ${SECRETS_BACKEND:-db}
      TENANT_APP_ORIGIN: ${TENANT_APP_ORIGIN}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4004/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  caddy_data:
  caddy_config:
