# Callora compact deploy — 3-bundle production topology.
#
# Use this in PROD on memory-tight servers. Use docker-compose.yml for dev.
#
#   docker compose -f docker-compose.compact.yml up -d
#
# Topology:
#   edge (4000)  = api-gateway + auth-service + platform-service
#   core (4002)  = campaign + lead + crm + analytics + workers
#   io   (4004)  = calling + billing + notification (raw-body webhooks first)
#
# Resource budget per bundle: 512 MiB RAM, 0.75 vCPU.
# Total stack ceiling: ~2 GiB RAM (3 bundles + db + redis).

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:15-alpine
    container_name: callora-db
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    mem_limit: 1g
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: callora-redis
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:6379:6379"
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  edge:
    build:
      context: .
      dockerfile: bundles/edge/Dockerfile
    image: callora/edge:latest
    container_name: callora-edge
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      PLATFORM_JWT_SECRET: ${PLATFORM_JWT_SECRET}
      TENANT_APP_ORIGIN: ${TENANT_APP_ORIGIN}
      ADMIN_APP_ORIGIN: ${ADMIN_APP_ORIGIN}
      CORE_BUNDLE_URL: http://core:4002
      IO_BUNDLE_URL: http://io:4004
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      core: { condition: service_started }
      io: { condition: service_started }
    mem_limit: 512m
    cpus: 0.75
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  core:
    build:
      context: .
      dockerfile: bundles/core/Dockerfile
    image: callora/core:latest
    container_name: callora-core
    restart: unless-stopped
    logging: *default-logging
    expose:
      - "4002"
    environment:
      NODE_ENV: production
      PORT: 4002
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      TENANT_APP_ORIGIN: ${TENANT_APP_ORIGIN}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      NOTIFICATION_SERVICE_URL: http://io:4004
      CALLING_SERVICE_URL: http://io:4004
      BILLING_SERVICE_URL: http://io:4004
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    mem_limit: 512m
    cpus: 0.75
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  io:
    build:
      context: .
      dockerfile: bundles/io/Dockerfile
    image: callora/io:latest
    container_name: callora-io
    restart: unless-stopped
    logging: *default-logging
    expose:
      - "4004"
    environment:
      NODE_ENV: production
      PORT: 4004
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      TENANT_APP_ORIGIN: ${TENANT_APP_ORIGIN}
      VAPI_PRIVATE_KEY: ${VAPI_PRIVATE_KEY}
      VAPI_PHONE_NUMBER_ID: ${VAPI_PHONE_NUMBER_ID}
      VAPI_WEBHOOK_SECRET: ${VAPI_WEBHOOK_SECRET}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_PRICE_FREE: ${STRIPE_PRICE_FREE}
      STRIPE_PRICE_STARTER: ${STRIPE_PRICE_STARTER}
      STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO}
      STRIPE_PRICE_ENTERPRISE: ${STRIPE_PRICE_ENTERPRISE}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    mem_limit: 512m
    cpus: 0.75
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4004/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

volumes:
  pgdata:
