version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: ezleads-db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ezleads
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ezleads-network

  backend:
    build: ./backend
    container_name: ezleads-backend
    command: npm run dev
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/ezleads?schema=public
      PORT: 4000
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      # API Keys should be passed via .env or injected
    ports:
      - "4000:4000"
    depends_on:
      - db
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - ezleads-network

  frontend:
    build: ./frontend
    container_name: ezleads-frontend
    command: npm run dev
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
      # Internal API URL for Server Side calls
      API_URL: http://backend:4000/api
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    networks:
      - ezleads-network

networks:
  ezleads-network:
    driver: bridge

volumes:
  postgres_data:
